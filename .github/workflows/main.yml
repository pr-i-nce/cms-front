name: Build Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: https://cms.penielchristianchurchkitui.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-frontend-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
